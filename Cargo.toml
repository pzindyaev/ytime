[package]
name = "ytime"
version = "0.1.0"
edition = "2021"
description = "Terminal time tracker for Yandex Tracker"
license = "MIT"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"
directories = "6"
thiserror = "2"
anyhow = "1"
fuzzy-matcher = "0.3"
clap = { version = "4", features = ["derive"] }
unicode-width = "0.2"
